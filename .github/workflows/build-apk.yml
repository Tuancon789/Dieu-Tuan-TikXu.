
name: Build DIEU TUAN TikXu v3.2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source v3.2
        run: |
          test -f Dieu_Tuan_TikXu_v3_2_Source.zip
          unzip -q Dieu_Tuan_TikXu_v3_2_Source.zip
          test -f TikXuAssist/app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK v3.2
        working-directory: TikXuAssist
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK v3.2
        uses: actions/upload-artifact@v4
        with:
          name: DIEU-TUAN-TikXu-v3.2-APK
          path: TikXuAssist/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
