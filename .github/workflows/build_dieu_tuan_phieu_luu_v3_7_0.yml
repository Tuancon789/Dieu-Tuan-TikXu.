          ROOT = Path('TikXuAssist')
          PKG = ROOT / 'app/src/main/java/com/example/tikxu'
          MAIN = PKG / 'MainActivity.java'
          AUTH = PKG / 'AuthApi.java'
          ADMIN = PKG / 'AdminActivity.java'
          MANIFEST = ROOT / 'app/src/main/AndroidManifest.xml'
          GRADLE = ROOT / 'app/build.gradle'
          STRINGS = ROOT / 'app/src/main/res/values/strings.xml'
          GAME = ROOT / 'app/src/main/assets/game/index.html'
          for p in (MAIN, AUTH, ADMIN, MANIFEST, GRADLE, STRINGS, GAME):
              if not p.is_file():
                  raise SystemExit('Missing original file or game asset: ' + str(p))
          original_hash = {p: hashlib.sha256(p.read_bytes()).hexdigest() for p in (AUTH, ADMIN)}

          src = MAIN.read_text(encoding='utf-8')
          old_login_success = 'runOnUiThread(() -> {unlocked=true; showDashboard();});'
          if src.count(old_login_success) != 1:
              raise SystemExit('Unknown login version: refusing to overwrite login logic')
          # Keep original login network/auth logic, navigate into the game after it succeeds.
          src = src.replace(old_login_success,
                            'runOnUiThread(() -> {unlocked=true; showDashboard(); launchGame();});', 1)
          start = src.index('    private void showDashboard() {')
          end = src.index('    private LinearLayout card() {', start)
          new_dashboard = '''    private void showDashboard() {
                  LinearLayout root = page();
                  root.addView(label("✦ ĐIỂU TUẤN PHIÊU LƯU ✦", 28, CYAN, true));
                  space(root, 12);
                  root.addView(label("Hành Trình Ánh Sáng • Rừng Tinh Linh", 17, Color.WHITE, true));
                  space(root, 18);
                  root.addView(label("Đăng nhập: " + AuthApi.username(this) +
                      (AuthApi.isAdmin(this) ? " • QUẢN TRỊ VIÊN" : " • TÀI KHOẢN CÓ HẠN"),
                      14, 0xff79f6c0, true));
                  if (!AuthApi.isAdmin(this)) {
                      long expires = getSharedPreferences("tikxu_auth", MODE_PRIVATE).getLong("expires_at", 0L);
                      if (expires > 0) {
                          SimpleDateFormat date = new SimpleDateFormat("dd/MM/yyyy HH:mm", Locale.forLanguageTag("vi-VN"));
                          date.setTimeZone(TimeZone.getTimeZone("Asia/Ho_Chi_Minh"));
                          root.addView(label("Hết hạn: " + date.format(new Date(expires)), 13, 0xffffd28c, false));
                      }
                  }
                  String notice = getSharedPreferences("tikxu_auth", MODE_PRIVATE).getString("notice", "");
                  if (!notice.isEmpty()) root.addView(label("Thông báo: " + notice, 12, 0xffffd18e, false));
                  space(root, 20);
                  Button play = action("⚔  VÀO GAME PHIÊU LƯU", true);
                  root.addView(play, buttonParams());
                  play.setOnClickListener(v -> launchGame());
                  root.addView(label("Tạo nhân vật • Rừng Tinh Linh • Đánh quái • Nhiệm vụ", 13, 0xffbbd6f4, false));
                  space(root, 12);
                  if (AuthApi.isAdmin(this)) {
                      Button admin = action("👑  QUẢN LÝ ADMIN / TÀI KHOẢN", false);
                      root.addView(admin, buttonParams());
                      admin.setOnClickListener(v -> startActivity(new Intent(this, AdminActivity.class)));
                  }
                  status = label("", 13, 0xffb0daef, false);
                  root.addView(status);
                  space(root, 16);
                  Button logout = action("🔒  ĐĂNG XUẤT", false);
                  root.addView(logout, buttonParams());
                  logout.setOnClickListener(v -> {
                      new Thread(() -> {
                          try { AuthApi.request(this, "POST", "/v1/logout", new JSONObject(), true); }
                          catch (Exception ignored) { }
                          AuthApi.clear(this);
                          runOnUiThread(this::showLogin);
                      }, "Adventure-Logout").start();
                  });
              }

              private void launchGame() {
                  if (!unlocked) return;
                  if (status != null) status.setText("Đang kiểm tra quyền chơi trên máy chủ...");
                  new Thread(() -> {
                      try {
                          JSONObject me = AuthApi.request(this, "GET", "/v1/me", null, true);
                          if (me.optBoolean("emergency_stop"))
                              throw new IllegalStateException("Quản trị viên đã tạm dừng dịch vụ");
                          runOnUiThread(() -> {
                              if (unlocked) startActivity(new Intent(this, GameActivity.class));
                          });
                      } catch (Exception err) {
                          runOnUiThread(() -> {
                              if (status != null) status.setText("Không mở được game: " + err.getMessage());
                          });
                      }
                  }, "Adventure-License").start();
              }

          '''
          src = src[:start] + new_dashboard + src[end:]
          # Change only labels, not the credentials, token, login route, or backend.
          src = src.replace('✦  QUẢN TRỊ VIÊN ĐIỂU TUẤN ĐẸP TRAI 🖕', '✦  ĐIỂU TUẤN PHIÊU LƯU ✦')
          src = src.replace('🔒 Máy chủ TikXu đã kết nối sẵn • không cần nhập URL',
                            '🔒 Máy chủ tài khoản đã kết nối sẵn')
          assert 'AuthApi.request(this,"POST","/v1/login",payload,false)' in src
          assert 'AuthApi.saveLogin(this,result);' in src
          assert 'LiveHuntV34' not in src and 'TapAccessibilityService' not in src
          MAIN.write_text(src, encoding='utf-8')

          # Old hunting engine and accessibility service are not part of the game.
          for name in ('LiveHuntV34.java', 'VisionReader.java', 'TapAccessibilityService.java'):
              (PKG / name).unlink(missing_ok=True)
          for img in (ROOT / 'app/src/main/assets').glob('chest_sample_*'):
              img.unlink()

          GRADLE.write_text(GRADLE.read_text(encoding='utf-8')
              .replace('versionCode 14', 'versionCode 16')
              .replace("versionName '0.3.6.4-scheduled-rooms'", "versionName '0.3.7.0-adventure'")
              .replace("    implementation 'com.google.mlkit:text-recognition:16.0.1'", ''),
              encoding='utf-8')
          assert "versionName '0.3.7.0-adventure'" in GRADLE.read_text(encoding='utf-8')
          STRINGS.write_text(STRINGS.read_text(encoding='utf-8')
              .replace('TikXu', 'Điểu Tuấn Phiêu Lưu'), encoding='utf-8')

          android = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android)
          tree = ET.parse(MANIFEST)
          manifest = tree.getroot()
          for el in list(manifest):
              if el.tag == 'uses-permission' and el.attrib.get(f'{{{android}}}name') != 'android.permission.INTERNET':
                  manifest.remove(el)
              if el.tag == 'queries':
                  manifest.remove(el)
          app = manifest.find('application')
          if app is None: raise SystemExit('Missing Android application tag')
          for el in list(app):
              if el.tag == 'service' and el.attrib.get(f'{{{android}}}name') == '.TapAccessibilityService':
                  app.remove(el)
          ET.SubElement(app, 'activity', {
              f'{{{android}}}name': '.GameActivity',
              f'{{{android}}}exported': 'false',
              f'{{{android}}}screenOrientation': 'sensorLandscape',
          })
          tree.write(MANIFEST, encoding='utf-8', xml_declaration=True)
          ET.parse(MANIFEST)

          (PKG / 'GameActivity.java').write_text(r'''package com.example.tikxu;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.net.Uri;
          import java.io.ByteArrayInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.Locale;

          /** Fully offline 2D game with trusted packaged assets. Login is checked by MainActivity. */
          public final class GameActivity extends Activity {
              private WebView web;
              private static final String HOST = "game.dieutuan.invalid";

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  if (AuthApi.token(this).length() < 20) { finish(); return; }
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                  web = new WebView(this);
                  web.setBackgroundColor(0xff061328);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setTextZoom(100);
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          return !("https".equalsIgnoreCase(u.getScheme()) && HOST.equalsIgnoreCase(u.getHost()));
                      }
                      @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if (!"https".equalsIgnoreCase(u.getScheme()) || !HOST.equalsIgnoreCase(u.getHost()))
                              return null;
                          String path = u.getPath();
                          if (path == null || path.isEmpty() || "/".equals(path)) path = "/index.html";
                          if (path.contains("..") || path.contains("\\") || path.startsWith("//")) return notFound();
                          try {
                              InputStream in = getAssets().open("game" + path);
                              String mime = path.endsWith(".html") ? "text/html" :
                                  path.endsWith(".webp") ? "image/webp" :
                                  path.endsWith(".png") ? "image/png" :
                                  path.endsWith(".js") ? "application/javascript" :
                                  path.endsWith(".css") ? "text/css" : "application/octet-stream";
                              return new WebResourceResponse(mime, "UTF-8", in);
                          } catch (IOException err) {
                              return notFound();
                          }
                      }
                  });
                  setContentView(web);
                  web.loadUrl("https://" + HOST + "/index.html");
              }
              private static WebResourceResponse notFound() {
                  return new WebResourceResponse("text/plain", "UTF-8",
                      new ByteArrayInputStream("Không tìm thấy tài nguyên trò chơi".getBytes(StandardCharsets.UTF_8)));
              }
              @Override protected void onPause() { if (web != null) web.onPause(); super.onPause(); }
              @Override protected void onResume() { super.onResume(); if (web != null) web.onResume(); }
              @Override protected void onDestroy() {
                  if (web != null) { web.stopLoading(); web.destroy(); web = null; }
                  super.onDestroy();
              }
              @Override public void onBackPressed() { finish(); }
          }
          ''', encoding='utf-8')

          for p, sha in original_hash.items():
              assert hashlib.sha256(p.read_bytes()).hexdigest() == sha, f'Authentication changed: {p.name}'
          for p in PKG.glob('*.java'):
              s = p.read_text(encoding='utf-8')
              assert not any(x in s for x in ('LiveHuntV34', 'VisionReader', 'TapAccessibilityService')), 'Old TikXu dependency: ' + str(p)
          print('Game source patched: account login, expiry, server and ADMIN retained. Game WebView assets embedded.')

          PATCH_GAME
          python3 /tmp/dieu_tuan_patch.py
      - name: Verify game assets and existing account code
        run: |
          set -euo pipefail
          test -f TikXuAssist/app/src/main/java/com/example/tikxu/GameActivity.java
          test -f TikXuAssist/app/src/main/assets/game/index.html
          test -f TikXuAssist/app/src/main/java/com/example/tikxu/AuthApi.java
          test -f TikXuAssist/app/src/main/java/com/example/tikxu/AdminActivity.java
          ! grep -Fq 'LiveHuntV34' TikXuAssist/app/src/main/java/com/example/tikxu/MainActivity.java
          grep -Fq 'AuthApi.saveLogin(this,result)' TikXuAssist/app/src/main/java/com/example/tikxu/MainActivity.java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: TikXuAssist
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload game APK
        uses: actions/upload-artifact@v4
        with:
          name: DIEU-TUAN-PHIEU-LUU-v3.7.0-APK
          path: TikXuAssist/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
