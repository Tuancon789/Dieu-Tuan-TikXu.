name: Build Dieu Tuan Auto Click WebView Demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout original repository
        uses: actions/checkout@v4
      - name: Extract original v3.6.4 source
        run: |
          unzip -q Dieu_Tuan_TikXu_v3_6_4_Source.zip
          test -f TikXuAssist/app/src/main/java/com/example/tikxu/AuthApi.java
      - name: Patch app while preserving custom login
        run: python3 scripts/make_autoclick_demo.py
      - name: Verify original login implementation was retained
        run: |
          grep -q 'AuthApi.saveLogin(this,result)' TikXuAssist/app/src/main/java/com/example/tikxu/MainActivity.java
          grep -q '/v1/login' TikXuAssist/app/src/main/java/com/example/tikxu/MainActivity.java
          grep -q 'class AuthApi' TikXuAssist/app/src/main/java/com/example/tikxu/AuthApi.java
          test -f TikXuAssist/app/src/main/java/com/example/tikxu/AdminActivity.java
          test ! -f TikXuAssist/app/src/main/java/com/example/tikxu/LiveHuntV34.java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: TikXuAssist
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dieu-Tuan-AutoClick-WebView-DEMO-APK
          path: TikXuAssist/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
