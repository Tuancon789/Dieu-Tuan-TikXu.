name: Build DIEU TUAN TikXu v3.6.1 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract v3.6.1 source
        run: |
          unzip -q Dieu_Tuan_TikXu_v3_6_1_Source.zip
          test -f TikXuAssist/app/build.gradle
          test -f TikXuAssist/app/src/main/java/com/example/tikxu/LiveHuntV34.java
          test -f TikXuAssist/app/src/main/res/drawable-nodpi/tikxu_bubble_photo.webp
          test -f TikXuAssist/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile TikXu v3.6.1
        working-directory: TikXuAssist
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DIEU-TUAN-TikXu-v3.6.1-APK
          path: TikXuAssist/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
