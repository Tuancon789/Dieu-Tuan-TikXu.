name: Build DIEU TUAN TikXu v3.3 APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract source v3.3
        run: |
          unzip -q Dieu_Tuan_TikXu_v3_3_Source.zip
          test -f TikXuAssist/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: TikXuAssist
        env:
          TIKXU_API_URL: ${{ vars.TIKXU_API_URL }}
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DIEU-TUAN-TikXu-v3.3-APK
          path: TikXuAssist/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
